# alembic.ini — settings for Alembic (database migrations). Run from the backend folder:
#   venv\Scripts\alembic upgrade head      (create / update the tables)
# The database address comes from DATABASE_URL in .env (see database.py), not from this file.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
