<!DOCTYPE html>
<!-- index.html — the main app: Money / Targets / Arcade tabs, bottom tab bar, and the Expenses pop-up (add expense / set budget). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Money</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <!-- ===== TAB 1: MONEY ===== -->
  <main id="page-money" class="page">
    <header class="page-head">
      <h1>Money</h1>
      <button class="logout-btn" type="button" data-logout>Log out</button>
    </header>
    <p id="greeting" class="muted"></p>

    <!-- Budget progress: "Spent Rs X of Rs Y" -->
    <section class="card budget-card">
      <p id="budget-text" class="budget-text">Loading…</p>
      <div class="progress" aria-hidden="true"><div id="budget-bar" class="progress-bar"></div></div>
      <p id="budget-warning" class="warning" hidden></p>
    </section>

    <!-- Tapping this card opens the Expenses pop-up -->
    <button id="expenses-card" class="card tap-card" type="button">
      <span class="tap-card-title">Expenses</span>
      <span id="expenses-total" class="tap-card-amount">Rs 0</span>
      <span class="muted">Tap to add an expense or set your budget</span>
    </button>

    <section class="card">
      <h2>This month</h2>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="expense-empty" class="muted">No expenses yet.</p>
    </section>
  </main>

  <!-- ===== TAB 2: TARGETS ===== -->
  <main id="page-targets" class="page" hidden>
    <header class="page-head"><h1>Targets</h1><button class="logout-btn" type="button" data-logout>Log out</button></header>
    <section class="card"><p>Savings goals are coming soon.</p></section>
  </main>

  <!-- ===== TAB 3: ARCADE ===== -->
  <main id="page-arcade" class="page" hidden>
    <header class="page-head"><h1>Arcade</h1><button class="logout-btn" type="button" data-logout>Log out</button></header>
    <section class="card"><p>Challenges and mini-games to help you hit your goals will live here.</p></section>
  </main>

  <!-- ===== BOTTOM TAB BAR ===== -->
  <nav class="tab-bar">
    <button class="tab-bar-btn active" type="button" data-tab="money">Money</button>
    <button class="tab-bar-btn" type="button" data-tab="targets">Targets</button>
    <button class="tab-bar-btn" type="button" data-tab="arcade">Arcade</button>
  </nav>

  <!-- ===== EXPENSES POP-UP =====
       Closes only from X / Cancel, after a successful save, or a tap on the dark area (see app.js). -->
  <div id="expense-modal" class="overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Expenses</h2>
        <button class="close-btn" type="button" data-close aria-label="Close">&times;</button>
      </div>

      <!-- Step 1: pick what to do -->
      <div id="modal-choice" class="modal-choice">
        <button id="choose-expense" class="btn" type="button">Add expense</button>
        <button id="choose-budget" class="btn btn-secondary" type="button">Set budget</button>
      </div>

      <!-- Add expense (novalidate: we show our own friendly messages) -->
      <form id="expense-form" hidden novalidate>
        <label>Amount (Rs) <input id="exp-amount" type="number" inputmode="decimal" min="0.01" step="0.01"></label>
        <label>Category <select id="exp-category"></select></label>
        <label>Description <input id="exp-note" type="text" maxlength="100" placeholder="e.g. lunch"></label>
        <label>Date <input id="exp-date" type="date"></label>
        <p id="expense-msg" class="message error" role="alert"></p>
        <button class="btn" type="submit">Save expense</button>
        <button class="btn btn-secondary" type="button" data-close>Cancel</button>
      </form>

      <!-- Set budget -->
      <form id="budget-form" hidden novalidate>
        <label>Monthly budget for all expenses (Rs)
          <input id="budget-amount" type="number" inputmode="decimal" min="1" step="0.01">
        </label>
        <p id="budget-msg" class="message error" role="alert"></p>
        <button class="btn" type="submit">Save budget</button>
        <button class="btn btn-secondary" type="button" data-close>Cancel</button>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="money-tab.js"></script>
</body>
</html>
