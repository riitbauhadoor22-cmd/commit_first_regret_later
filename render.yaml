# render.yaml — Render Blueprint for the app (free Web Service, fixed https://<name>.onrender.com link).
# Render reads THIS file (top of the repo) by default; there is no other copy. The app (commitlocal/backend) serves the
# API and the frontend from the same address, so no CORS is needed. The database is a free hosted PostgreSQL (Neon):
# paste its URL as DATABASE_URL. Render's disk is wiped on every restart, so SQLite can't be used there.
# sync: false = you type the value in Render's dashboard (never in this file or git).
# Back up Neon (Branches → Create branch) before every deploy: migrations run when the app starts.
services:
  - type: web
    name: pennywise                # → https://pennywise.onrender.com
    runtime: python
    plan: free
    rootDir: commitlocal/backend
    buildCommand: pip install -r requirements.txt
    # Alembic migrations run when the app starts (main.py → create_tables). No --reload in production.
    # --proxy-headers: Render serves https in front of the app, so login cookies are marked secure
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    autoDeploy: true               # every push to the connected branch redeploys
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: APP_ENV               # production: Secure cookies, HSTS, no /docs, DEMO_TODAY ignored
        value: production
      - key: DATABASE_URL          # required: Neon connection string (postgresql://...?sslmode=require)
        sync: false
      # Login code emails: Render's free plan blocks SMTP ports, so Gmail SMTP can't work here -> Brevo HTTP API
      - key: BREVO_API_KEY         # required: Brevo API key (app.brevo.com -> SMTP & API -> API keys)
        sync: false
      - key: EMAIL_FROM            # required: sender address, verified in Brevo (Senders & IP)
        sync: false
      - key: EMAIL_FROM_NAME       # optional: empty = Pennywise
        sync: false
      - key: GMAIL_ADDRESS         # not used on Render (Brevo is used when BREVO_API_KEY is set)
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY          # optional: AI insights + Scan bill
        sync: false
      - key: GROQ_MODEL            # optional: empty = openai/gpt-oss-20b
        sync: false
      - key: GROQ_VISION_MODEL     # optional: empty = qwen/qwen3.8-27b (Groq vision models are preview models)
        sync: false
      - key: DEMO_SHOW_OTP         # optional: empty / false = off. "true" ONLY during a live demo (code on screen)
        sync: false
